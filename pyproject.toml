[project]
name = "arxave"
version = "0.1.0"
description = "A daily arXiv scout that briefs you on the papers that matter"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=2.1",
    "anthropic>=0.69",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Postgres runtime backend (Supabase). Tests and offline runs use the stdlib
# sqlite3 driver and need nothing here.
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
arxave = "arxave.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
