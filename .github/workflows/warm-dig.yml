name: Warm the Dig cache

# arXiv announces at 20:00 ET on Sun–Thu evenings, which is 00:00/01:00 UTC the
# *next* day — so the feed lands on UTC Mon–Fri, not Tue–Sat. The first run is
# at 02:13 UTC (04:13 CEST), an hour behind the announcement, so whoever opens
# the page in the European morning finds the day already embedded.
#
# The odd minute is deliberate. GitHub's cron dispatcher is a shared,
# best-effort pipeline and it congests hardest on round minutes, where most
# crons in the world sit. The first scheduled run of this workflow was set for
# 01:30 UTC and the event arrived at 03:38 — the runner then started it with
# zero queue wait and finished in 43 s, so the two hours were dispatch, not us.
#
# The 06:13 UTC (08:13 CEST) run is the catch-up, for the mornings the dispatch
# slips anyway or arXiv announces late. No guard on it: the warmer only embeds
# what is not already cached, so a second run on a day that already went
# through costs a minute and writes nothing.
#
# GitHub cron is UTC and does not follow DST — in winter these are 03:00/07:00
# CET. Shift both back an hour if the local times matter more than the offset
# from the announcement.
on:
  schedule:
    - cron: '13 2 * * 1-5'
    - cron: '13 6 * * 1-5'
  workflow_dispatch:
    inputs:
      categories:
        description: 'arXiv categories (comma-separated)'
        type: string
        default: 'quant-ph, cond-mat.mes-hall, cs.AI, cs.LG'
      dry_run:
        description: 'Embed but write nothing'
        type: boolean
        default: false

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The model is 32 MB and never changes. It has to be cached from a path
      # outside node_modules — transformers.js defaults its Node cache to
      # `node_modules/@huggingface/transformers/.cache/`, which `npm install`
      # recreates every run — so the warmer points `env.cacheDir` here.
      # Unauthenticated huggingface.co pulls from shared CI egress do get 429s,
      # which is why this matters beyond speed.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: scripts/.model-cache
          key: hf-bge-small-en-v1.5-q8

      - name: Install warmer dependencies
        working-directory: scripts
        run: npm install --no-package-lock --no-audit --no-fund

      # Cheap, and it guards the one failure this job cannot detect itself: if
      # the warmer's parse diverges from the browser's, every vector is filed
      # under a key nobody looks up and the job still reports success.
      - name: Check the parse still matches the browser's
        working-directory: scripts
        run: node --test warm-dig.test.mjs

      - name: Warm
        working-directory: scripts
        env:
          DIG_WRITE_KEY: ${{ secrets.DIG_WRITE_KEY }}
          DIG_CACHE_URL: ${{ vars.ARXAVE_DIG_CACHE_URL }}
        run: |
          node warm-dig.mjs \
            --categories "${{ inputs.categories || vars.ARXAVE_WARM_CATEGORIES || 'quant-ph, cond-mat.mes-hall, cs.AI, cs.LG' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
