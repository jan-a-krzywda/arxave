name: Warm the Dig cache

# WHEN THE FEED EXISTS IS THE WHOLE CONSTRAINT. arXiv rebuilds the announcement
# RSS around 04:00 UTC — its `pubDate` is midnight ET, which *is* 04:00 UTC —
# and serves the previous day's listing until then. Measured 2026-08-12:
# `lastBuildDate: Wed, 12 Aug 2026 04:00:21 +0000`. So nothing useful can be
# warmed before ~04:00 UTC, which is 06:00 CEST. An earlier run is not merely
# early: it warms yesterday, finds it all cached, and exits 0.
#
# 04:20 UTC (06:20 CEST) is therefore the first run, twenty minutes after the
# rebuild. The odd minute is deliberate too — GitHub's cron dispatcher is shared
# and best-effort, and congests hardest on round minutes. This workflow's first
# scheduled run was set for 01:30 UTC and the event arrived at 03:38; the runner
# then started it instantly and finished in 43 s, so the delay was dispatch.
#
# 06:13 UTC (08:13 CEST) is the catch-up, for the mornings dispatch slips or
# arXiv rebuilds late. No guard on it: the warmer only embeds what is not
# already cached, so a second run on a warmed day costs a minute and writes
# nothing. The warmer itself refuses a stale feed (exit 3) rather than
# reporting a healthy-looking run over yesterday's papers.
#
# The feed lands on UTC Mon–Fri (it carries <skipDays>Sat, Sun</skipDays>).
#
# GitHub cron is UTC and does not follow DST — in winter these are 05:20/07:13
# CET. The offset from the 04:00 UTC rebuild is what matters here, not the local
# clock, so leave them alone unless arXiv moves.
on:
  schedule:
    - cron: '20 4 * * 1-5'
    - cron: '13 6 * * 1-5'
  workflow_dispatch:
    inputs:
      categories:
        description: 'arXiv categories (comma-separated)'
        type: string
        default: 'quant-ph, cond-mat.mes-hall, cs.AI, cs.LG'
      dry_run:
        description: 'Embed but write nothing'
        type: boolean
        default: false

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The model is 32 MB and never changes. It has to be cached from a path
      # outside node_modules — transformers.js defaults its Node cache to
      # `node_modules/@huggingface/transformers/.cache/`, which `npm install`
      # recreates every run — so the warmer points `env.cacheDir` here.
      # Unauthenticated huggingface.co pulls from shared CI egress do get 429s,
      # which is why this matters beyond speed.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: scripts/.model-cache
          key: hf-bge-small-en-v1.5-q8

      - name: Install warmer dependencies
        working-directory: scripts
        run: npm install --no-package-lock --no-audit --no-fund

      # Cheap, and it guards the one failure this job cannot detect itself: if
      # the warmer's parse diverges from the browser's, every vector is filed
      # under a key nobody looks up and the job still reports success.
      - name: Check the parse still matches the browser's
        working-directory: scripts
        run: node --test warm-dig.test.mjs

      - name: Warm
        working-directory: scripts
        env:
          DIG_WRITE_KEY: ${{ secrets.DIG_WRITE_KEY }}
          DIG_CACHE_URL: ${{ vars.ARXAVE_DIG_CACHE_URL }}
        run: |
          node warm-dig.mjs \
            --categories "${{ inputs.categories || vars.ARXAVE_WARM_CATEGORIES || 'quant-ph, cond-mat.mes-hall, cs.AI, cs.LG' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
