name: Warm the Dig cache

# THIS WORKFLOW HAS NO SCHEDULE, ON PURPOSE. Its clock lives in Postgres, in
# [`supabase/warm-cron.sql`](../../supabase/warm-cron.sql) — a pg_cron job that
# POSTs to the Actions dispatch API at 04:10 and 06:13 UTC, Mon–Fri.
#
# WHEN THE FEED EXISTS IS THE WHOLE CONSTRAINT, and it is why the clock moved.
# arXiv rebuilds the announcement RSS around 04:00 UTC — its `pubDate` is
# midnight ET, which *is* 04:00 UTC — and serves the previous day's listing
# until then. Measured 2026-08-12: `lastBuildDate: Wed, 12 Aug 2026 04:00:21
# +0000`. So nothing useful can be warmed before 06:00 CEST, leaving a narrow
# window before anyone is awake to read the feed — and `on: schedule` could not
# hit it. GitHub's cron dispatcher is shared and best-effort: this workflow's
# `30 1` cron fired at 03:38 UTC (+2h08) and its `13 6` at 07:50 UTC (+1h37).
# A warm that slips two hours is not a warm cache in the morning.
#
# `workflow_dispatch` has no such queue. Measured 2026-08-12: created
# 06:50:44Z, started 06:50:44Z, done 06:51:48Z. The work stayed here — ~750
# abstracts is a job with a clock, not a request, and the secrets already live
# here — and only the trigger left.
#
# Both schedules are in the SQL file, with the reasoning for their times.
# Changing the timing means editing that file, not this one.
on:
  workflow_dispatch:
    inputs:
      # Deliberately no `default:`. Every run is a dispatch now, and GitHub
      # fills a declared default in on API dispatches too — so a default here
      # would always win the `||` below and `vars.ARXAVE_WARM_CATEGORIES` would
      # silently stop having any effect. Empty means "use the repo variable".
      categories:
        description: 'arXiv categories (comma-separated) — blank uses ARXAVE_WARM_CATEGORIES'
        type: string
      # Same deal — no default, so the repo variable stays meaningful.
      lookback:
        description: 'Weekdays to warm, tonight included — blank uses ARXAVE_WARM_LOOKBACK, then 2'
        type: string
      dry_run:
        description: 'Embed but write nothing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # There is no model to cache any more. This step used to restore 32 MB
      # of transformers.js weights from outside node_modules, because an
      # unauthenticated huggingface.co pull from shared CI egress gets 429s.
      # The warmer calls the hosted `embed` function now, so the runner
      # downloads nothing and holds no model.

      - name: Install warmer dependencies
        working-directory: scripts
        run: npm install --no-package-lock --no-audit --no-fund

      # Cheap, and they guard the two failures this job cannot detect itself: a
      # parse that diverges from the browser's files every vector under a key
      # nobody looks up, and a blend that diverges from the browser's makes the
      # feed recommend papers the page would not. Both report success.
      - name: Check the parse and the blend still match the browser's
        working-directory: scripts
        run: node --test warm-dig.test.mjs preset-feed.test.mjs enrich.test.mjs

      - name: Warm
        working-directory: scripts
        env:
          DIG_WRITE_KEY: ${{ secrets.DIG_WRITE_KEY }}
          DIG_CACHE_URL: ${{ vars.ARXAVE_DIG_CACHE_URL }}
          # The pick. No token here: the function holds HF_TOKEN, and the
          # runner only ever talks to the function.
          EMBED_URL: ${{ vars.ARXAVE_EMBED_URL }}
        run: |
          node warm-dig.mjs \
            --categories "${{ inputs.categories || vars.ARXAVE_WARM_CATEGORIES || 'quant-ph, cond-mat.mes-hall, cs.AI, cs.LG' }}" \
            --lookback "${{ inputs.lookback || vars.ARXAVE_WARM_LOOKBACK || '2' }}" \
            --presets ../docs/presets \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Runs after the warm, so in the normal case every vector it needs is a
      # cache hit and the model is never loaded a second time.
      - name: Build the preset feeds
        if: ${{ !inputs.dry_run }}
        working-directory: scripts
        env:
          DIG_CACHE_URL: ${{ vars.ARXAVE_DIG_CACHE_URL }}
          ARXAVE_SITE: ${{ vars.ARXAVE_SITE }}
          # Optional. Without it the feed still builds, carrying grades and
          # abstracts and no verdict line — the enricher fails soft by design.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node preset-feed.mjs --presets ../docs/presets --out ../docs/feeds

      # An unchanged feed is the normal Saturday outcome and not worth a commit;
      # `git diff --staged --quiet` is what keeps this from pushing every run.
      #
      # THE REF GUARD IS NOT BELT-AND-BRACES, it is a fix. Measured 2026-08-16:
      # this job was dispatched on a feature branch to test a warmer change, and
      # the step below committed the rebuilt feeds, `git pull --rebase`'d onto
      # main, and pushed — landing a commit whose parent was main on top of the
      # feature branch and dropping the branch's own commit outright. The work
      # survived only because it also existed on a laptop. A job with
      # `contents: write` that rebases onto main must never push to a ref that
      # is not main; dispatching on a branch is how you test this workflow, and
      # testing it should not cost you the branch.
      - name: Commit the feeds
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "Arxave Bot"
          git config user.email "arxave-bot@users.noreply.github.com"
          git add docs/feeds/
          if git diff --staged --quiet; then
            echo 'Feeds unchanged — nothing to push.'
            exit 0
          fi
          git commit -m "feeds: $(date -u +%F) preset feeds"
          # Explicit about both ends. `git push` with no refspec pushes whatever
          # the rebase left HEAD pointing at, wherever the branch happens to
          # track — which is how the incident above got its reach.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
