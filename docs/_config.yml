title: arXave
description: Wash a night of arXiv and keep the few papers worth a careful look.
theme: minima
plugins:
  - jekyll-feed

# Three items, in the order the work runs: Dig (the filter, at the site root),
# Stockpile (everything kept), Haul (tonight's, as feeds). filter-moved.md and
# seams-moved.md only redirect and stay out of the nav.
header_pages:
  - filter.md
  - stockpile.md
  - haul.md

# The repo the header's GitHub link points at. Unset means no link at all,
# so a fork that has not set it does not send its readers here.
github_repo: https://github.com/jan-a-krzywda/arxave

collections:
  briefs:
    output: true
    permalink: /briefs/:name/

defaults:
  - scope:
      path: ""
      type: briefs
    values:
      layout: brief

