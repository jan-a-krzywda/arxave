title: arXave
description: Wash a night of arXiv and keep the few papers worth a careful look.
theme: minima
plugins:
  - jekyll-feed

# The four rooms, in the order a reader wants them: Dig (the filter, at the
# site root), Haul (tonight's, as wagons and feeds), Stockpile (everything
# kept, still WIP), Details (what the machine does). Haul comes before
# Stockpile because it is the finished room and the one a stranger should land
# in first. This list is the whole nav — _includes/header.html reads the order
# from here and the icon, gloss and WIP mark from each page's front matter.
# filter-moved.md and seams-moved.md only redirect and stay out of the nav.
header_pages:
  - filter.md
  - haul.md
  - stockpile.md
  - details.md

# The repo the header's GitHub link points at. Unset means no link at all,
# so a fork that has not set it does not send its readers here.
github_repo: https://github.com/jan-a-krzywda/arxave

collections:
  briefs:
    output: true
    permalink: /briefs/:name/

defaults:
  - scope:
      path: ""
      type: briefs
    values:
      layout: brief

