title: arXave
description: Wash a night of arXiv and keep the few papers worth a careful look.
theme: minima
plugins:
  - jekyll-feed

# The filter page is the site root, reached by the title in the header, so it
# is not repeated here. filter-moved.md only redirects and stays out of the nav.
header_pages:
  - seams.md
  - stockpile.md
  - briefs.md

collections:
  briefs:
    output: true
    permalink: /briefs/:name/

defaults:
  - scope:
      path: ""
      type: briefs
    values:
      layout: brief

